<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My applications')}"></head>
<body data-require="STUDENT">
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="fw-bold mb-0">Application tracker</h2>
        <select class="form-select w-auto" id="statusFilter" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="APPLIED">Applied</option><option value="UNDER_REVIEW">Under review</option>
            <option value="ONLINE_ASSESSMENT">Online assessment</option><option value="INTERVIEW">Interview</option>
            <option value="SELECTED">Selected</option><option value="REJECTED">Rejected</option>
        </select>
    </div>
    <div id="alertBox"></div>
    <div class="row g-3" id="appList"></div>
    <div class="mt-4" id="pager"></div>
</main>

<div class="modal fade" id="notesModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Personal notes</h5><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div>
    <div class="modal-body">
        <div id="notesAlert"></div>
        <p class="small text-muted mb-2" id="notesFor"></p>
        <textarea class="form-control" id="notesText" rows="6" maxlength="5000" placeholder="Interview tips, contacts, follow-ups..."></textarea>
    </div>
    <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
        <button class="btn btn-primary" id="saveNotes" type="button">Save notes</button></div>
</div></div></div>

<div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Status history</h5><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div>
    <div class="modal-body" id="historyBody"></div>
</div></div></div>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/applications.js}"></script>
</body>
</html>
