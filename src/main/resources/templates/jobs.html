<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Jobs')}"></head>
<body data-require="STUDENT">
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="fw-bold mb-0">Job opportunities</h2>
        <ul class="nav nav-pills" id="tabs">
            <li class="nav-item"><button class="nav-link active" data-tab="all" type="button">All jobs</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="saved" type="button">&#9733; Wishlist</button></li>
        </ul>
    </div>
    <div id="alertBox"></div>

    <form id="filterForm" class="card card-body shadow-sm border-0 mb-3">
        <div class="row g-2">
            <div class="col-md-3"><input class="form-control" name="role" placeholder="Role (e.g. Developer)"></div>
            <div class="col-md-3"><input class="form-control" name="company" placeholder="Company"></div>
            <div class="col-md-3"><input class="form-control" name="location" placeholder="Location"></div>
            <div class="col-md-3"><input class="form-control" name="skills" placeholder="Skills (java, spring)"></div>
            <div class="col-md-3">
                <select class="form-select" name="jobType">
                    <option value="">All job types</option><option value="FULL_TIME">Full time</option>
                    <option value="PART_TIME">Part time</option><option value="INTERNSHIP">Internship</option>
                    <option value="CONTRACT">Contract</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" name="sort">
                    <option value="createdAt,desc">Newest first</option>
                    <option value="salaryLpa,desc">Highest salary</option>
                    <option value="applicationDeadline,asc">Deadline soonest</option>
                    <option value="title,asc">Title A-Z</option>
                </select>
            </div>
            <div class="col-md-3 d-flex align-items-center">
                <div class="form-check"><input class="form-check-input" type="checkbox" id="eligibleOnly" name="eligibleOnly">
                    <label class="form-check-label" for="eligibleOnly">Only jobs I am eligible for</label></div>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-primary flex-fill" type="submit">Search</button>
                <button class="btn btn-outline-secondary" type="button" id="resetBtn">Reset</button>
            </div>
        </div>
    </form>

    <p class="text-muted small" id="summary"></p>
    <div class="row g-3" id="jobList"></div>
    <div class="mt-4" id="pager"></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/jobs.js}"></script>
</body>
</html>
