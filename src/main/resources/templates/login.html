<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body data-require="guest">
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <div class="card auth-card"><div class="card-body p-4">
        <h3 class="fw-bold mb-1">Welcome back</h3>
        <p class="text-muted">Log in to continue tracking your applications.</p>
        <div id="alertBox"></div>
        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" required autocomplete="username">
                <div class="invalid-feedback">Enter a valid email address.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
                <div class="invalid-feedback">Enter your password.</div>
            </div>
            <button class="btn btn-primary w-100" type="submit" id="submitBtn">Log in</button>
        </form>
        <p class="text-center small mt-3 mb-0">New here? <a th:href="@{/register}">Create an account</a></p>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
