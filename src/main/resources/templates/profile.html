<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body data-require="STUDENT">
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4" style="max-width: 820px;">
    <h2 class="fw-bold">My profile</h2>
    <p class="text-muted">Your CGPA and skills decide which jobs you are eligible for.</p>
    <div id="alertBox"></div>
    <div class="row" id="loading"><div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div></div></div>
    <form id="profileForm" class="card shadow-sm border-0 d-none" novalidate>
        <div class="card-body p-4"><div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="fullName">Full name</label>
                <input class="form-control" id="fullName" name="fullName" maxlength="100" required>
                <div class="invalid-feedback">Name is required.</div></div>
            <div class="col-md-6"><label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" disabled></div>
            <div class="col-md-6"><label class="form-label" for="phone">Phone</label>
                <input class="form-control" id="phone" name="phone" maxlength="20" pattern="[0-9+\-\s]{7,20}">
                <div class="invalid-feedback">Enter a valid phone number.</div></div>
            <div class="col-md-6"><label class="form-label" for="college">College</label>
                <input class="form-control" id="college" name="college" maxlength="150"></div>
            <div class="col-md-4"><label class="form-label" for="degree">Degree</label>
                <input class="form-control" id="degree" name="degree" maxlength="80" placeholder="B.Tech"></div>
            <div class="col-md-4"><label class="form-label" for="branch">Branch</label>
                <input class="form-control" id="branch" name="branch" maxlength="80" placeholder="CSE"></div>
            <div class="col-md-4"><label class="form-label" for="graduationYear">Graduation year</label>
                <input class="form-control" type="number" id="graduationYear" name="graduationYear" min="2000" max="2100">
                <div class="invalid-feedback">Enter a year between 2000 and 2100.</div></div>
            <div class="col-md-4"><label class="form-label" for="cgpa">CGPA (0 - 10)</label>
                <input class="form-control" type="number" id="cgpa" name="cgpa" min="0" max="10" step="0.01">
                <div class="invalid-feedback">CGPA must be between 0 and 10.</div></div>
            <div class="col-md-8"><label class="form-label" for="resumeUrl">Resume link</label>
                <input class="form-control" type="url" id="resumeUrl" name="resumeUrl" maxlength="255" placeholder="https://...">
                <div class="invalid-feedback">Enter a valid URL.</div></div>
            <div class="col-12"><label class="form-label" for="skills">Skills (comma separated)</label>
                <textarea class="form-control" id="skills" name="skills" rows="2" maxlength="500" placeholder="Java, Spring Boot, MySQL"></textarea></div>
        </div></div>
        <div class="card-footer bg-transparent text-end p-3">
            <button class="btn btn-primary px-4" type="submit" id="submitBtn">Save profile</button>
        </div>
    </form>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/profile.js}"></script>
</body>
</html>
