<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body data-require="guest">
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <div class="card auth-card"><div class="card-body p-4">
        <h3 class="fw-bold mb-1">Create your account</h3>
        <p class="text-muted">Students register here. It takes less than a minute.</p>
        <div id="alertBox"></div>
        <form id="registerForm" novalidate>
            <div class="mb-3">
                <label class="form-label" for="fullName">Full name</label>
                <input class="form-control" id="fullName" name="fullName" maxlength="100" required autocomplete="name">
                <div class="invalid-feedback">Please enter your name.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" maxlength="150" required autocomplete="username">
                <div class="invalid-feedback">Enter a valid email address.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" minlength="8" maxlength="72"
                       pattern="^(?=.*[A-Za-z])(?=.*[0-9]).{8,72}$" required autocomplete="new-password">
                <div class="form-text">At least 8 characters, with a letter and a number.</div>
                <div class="invalid-feedback">Use 8 or more characters including a letter and a number.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirm">Confirm password</label>
                <input class="form-control" type="password" id="confirm" name="confirm" required autocomplete="new-password">
                <div class="invalid-feedback">Passwords do not match.</div>
            </div>
            <button class="btn btn-primary w-100" type="submit" id="submitBtn">Create account</button>
        </form>
        <p class="text-center small mt-3 mb-0">Already registered? <a th:href="@{/login}">Log in</a></p>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/register.js}"></script>
</body>
</html>
