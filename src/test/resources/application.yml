# Test configuration: in-memory H2, so tests need no MySQL and no env variables.
spring:
  datasource:
    url: jdbc:h2:mem:jobtrack-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  jwt:
    secret: dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtMTIzNDU2
    expiration-ms: 3600000
